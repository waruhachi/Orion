name: Create Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        xcode-version: ["16.4"]
        package-scheme:
          - name: rootful
            value: ""
          - name: rootless
            value: rootless
          - name: roothide
            value: roothide

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: orion

      - name: Set Up Dependencies
        run: |
          brew install ldid make

          echo "THEOS=${GITHUB_WORKSPACE}/theos" >> "${GITHUB_ENV}"
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "${GITHUB_PATH}"

          cat > "${RUNNER_TEMP}/theos-fakeroot" <<'EOF'
          #!/bin/bash
          set -e

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -c)
                shift
                ;;
              -r|-p)
                shift
                if [[ $# -gt 0 ]]; then
                  shift
                fi
                ;;
              *)
                break
                ;;
            esac
          done

          if [[ $# -eq 0 ]]; then
            exit 0
          fi

          exec "$@"
          EOF

          chmod +x "${RUNNER_TEMP}/theos-fakeroot"

      - name: Install Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build Release
        working-directory: orion
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode-version }}.app/Contents/Developer
          PACKAGE_SCHEME: ${{ matrix.package-scheme.value }}
        run: |
          make clean package \
            FAKEROOT="${RUNNER_TEMP}/theos-fakeroot" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${PACKAGE_SCHEME}"

          mkdir -p ../release

          shopt -s nullglob
          debs=(packages/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No .deb packages were produced"
            exit 1
          fi

          for deb in "${debs[@]}"; do
            filename="$(basename "$deb")"
            cp "$deb" "../release/${{ matrix.package-scheme.name }}_${filename}"
          done

          if [ -d packages/Orion.framework ]; then
            (
              cd packages
              zip -yr9 "../release/Orion_${{ matrix.package-scheme.name }}_framework.zip" Orion.framework
            )
          fi

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-${{ matrix.package-scheme.name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          pattern: orion-release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --draft \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            release/*