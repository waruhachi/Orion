name: Create Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        xcode-version: ["16.4"]
        package-scheme:
          - name: rootful
            value: ""
          - name: rootless
            value: rootless
          - name: roothide
            value: roothide

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: orion

      - name: Set Up Dependencies
        run: |
          brew install ldid make fakeroot
          echo "THEOS=${GITHUB_WORKSPACE}/theos" >> "${GITHUB_ENV}"
          echo "PATH=/usr/local/opt/make/libexec/gnubin:${PATH}" >> "${GITHUB_ENV}"

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Build Release
        working-directory: orion
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode-version }}.app/Contents/Developer
          PACKAGE_SCHEME: ${{ matrix.package-scheme.value }}
        run: |
          make clean package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${PACKAGE_SCHEME}"

          mkdir -p ../release

          deb_path="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

          if [ -z "${deb_path}" ]; then
            echo "No Debian package was produced"
            exit 1
          fi

          cp "${deb_path}" \
            "../release/Orion_${{ github.ref_name }}_${{ matrix.package-scheme.name }}.deb"

          if [ ! -d packages/Orion.framework ]; then
            echo "Orion.framework was not produced"
            exit 1
          fi

          (
            cd packages
            zip -yr9 \
              "../release/Orion_${{ github.ref_name }}_${{ matrix.package-scheme.name }}_framework.zip" \
              Orion.framework
          )

      - name: Upload Release Packages
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-${{ matrix.package-scheme.name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          pattern: orion-release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --draft \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            release/*