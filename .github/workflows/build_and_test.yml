name: Build and Test

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run tests
        run: swift test

  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootful, rootless, roothide]
        include:
          - scheme: rootful
            scheme_arg: ""
          - scheme: rootless
            scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
          - scheme: roothide
            scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: orion

      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Set up Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV

      - name: Install Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build Package
        working-directory: orion
        run: |
          make clean package ${{ matrix.scheme_arg }}