name: Build and Test

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run tests
        run: swift test

  build:
    strategy:
      fail-fast: false
      matrix:
        xcode-version: ["16.4"]
        package-scheme:
          - name: rootful
            value: ""
          - name: rootless
            value: rootless
          - name: roothide
            value: roothide

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: orion

      - name: Set Up Dependencies
        run: |
          brew install ldid make

          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "${GITHUB_PATH}"

          cat > "${RUNNER_TEMP}/theos-fakeroot" <<'EOF'
          #!/bin/bash
          set -e

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -c)
                shift
                ;;
              -r|-p)
                shift
                if [[ $# -gt 0 ]]; then
                  shift
                fi
                ;;
              *)
                break
                ;;
            esac
          done

          if [[ $# -eq 0 ]]; then
            exit 0
          fi

          exec "$@"
          EOF

          chmod +x "${RUNNER_TEMP}/theos-fakeroot"

      - name: Install Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build ${{ matrix.package-scheme.name }}
        working-directory: orion
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode-version }}.app/Contents/Developer
          PACKAGE_SCHEME: ${{ matrix.package-scheme.value }}
        run: |
          make clean package \
            FAKEROOT="${RUNNER_TEMP}/theos-fakeroot" \
            THEOS_PACKAGE_SCHEME="${PACKAGE_SCHEME}"